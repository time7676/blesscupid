appId: com.julianloh.blesscupiddev
name: Today decision flow
tags:
  - critical
---
# Critical path 3 — Today single-card decision UI. Pass quietly, Begin (Like),
# and Favorite-once-per-day quota. Verifies POST /matches/decision wiring.

- launchApp
- assertVisible: "Today"
- assertVisible: "One at a time"

# First card — Pass quietly
- assertVisible:
    text: "/ 3"
- tapOn: "Pass quietly"

# Second card — Favorite (consumes the day's 1/day quota)
- assertVisible:
    text: "2 / 3"
    optional: true
- tapOn: "★ Favorite"

# Favorite button now disabled
- assertVisible: "Favorite used"

# Third card — Begin (Like) → Conversations.Pending
- tapOn: "Begin"

# Tab over to Conversations and confirm Pending section has at least 1 row
- tapOn: "Conversations"
- assertVisible:
    text: "Sent, awaiting reply"
    optional: true
