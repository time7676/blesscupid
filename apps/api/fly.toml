# BlessCupid API — Fly.io config (placeholder; finalize in BLE-? deploy issue)
app = "blesscupid-api"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

# Runs once per deploy in a release machine before the new VM serves traffic.
# Applies any pending Prisma migrations against DATABASE_URL. Idempotent —
# `prisma migrate deploy` is a no-op when the DB is already current. See
# docs/deploy/RUNBOOK.md §1.5 (Database migrations).
[deploy]
  release_command = "node_modules/.bin/prisma migrate deploy"
  strategy = "rolling"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512
