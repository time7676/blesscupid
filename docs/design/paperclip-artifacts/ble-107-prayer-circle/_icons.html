<!-- Icon library — inlined SVGs reused across surfaces.
     All icons are stroke-based, 24×24 grid, 1.6 stroke, round caps/joins.
     Designed to be tradition-neutral. -->

<!-- ── PRIMARY (approved) ────────────────────────────────────── -->

<!-- COMMUNITY-RING: three abstract dots in a ring with the gold link -->
<svg id="ic-ring" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="12" cy="12" r="7.2" stroke="currentColor" stroke-width="1.5" stroke-dasharray="0.4 3.2" stroke-linecap="round"/>
  <circle cx="12" cy="4.8" r="2" fill="currentColor"/>
  <circle cx="18.24" cy="15.6" r="2" fill="currentColor"/>
  <circle cx="5.76" cy="15.6" r="2" fill="currentColor"/>
</svg>

<!-- CLASPED-HANDS (abstract, two interlocking arcs — not Dürer hands) -->
<svg id="ic-clasp" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 12c0-3.5 2.5-6 5-6.5v6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 12c0-3.5-2.5-6-5-6.5v6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M5 12c0 3.5 3 6 7 6s7-2.5 7-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9 12.5c.8 1 1.8 1.5 3 1.5s2.2-.5 3-1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>

<!-- OPEN-PALMS (two abstract upward arcs cradling a dot — universal "receive" gesture) -->
<svg id="ic-palms" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M3.5 14c0-3 2.2-5.5 5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M20.5 14c0-3-2.2-5.5-5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M5.5 14c0 3 3 5.5 6.5 5.5S18.5 17 18.5 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="12" cy="9.5" r="1.4" fill="currentColor"/>
</svg>

<!-- DOOR-OPEN (Join — door opens inward, member entering ring) -->
<svg id="ic-join" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 4h10v16H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M14 4l6 2v12l-6 2" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="11" cy="12" r="0.9" fill="currentColor"/>
</svg>

<!-- DOOR-OUT (Leave — same door, mirrored. Symmetric weight.) -->
<svg id="ic-leave" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M20 4H10v16h10z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M10 4L4 6v12l6 2" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="13" cy="12" r="0.9" fill="currentColor"/>
</svg>

<!-- VISIBLE-EYE (consent state: who can see) -->
<svg id="ic-eye" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M2.5 12c2.5-4 5.7-6 9.5-6s7 2 9.5 6c-2.5 4-5.7 6-9.5 6s-7-2-9.5-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
</svg>

<!-- LOCK (private prayer: "only me + admin pastor") -->
<svg id="ic-lock" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="4.5" y="10" width="15" height="10" rx="2.4" stroke="currentColor" stroke-width="1.6"/>
  <path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>

<!-- PRAY-DOT (pray-for-this affordance: lit dot moving along ring) -->
<svg id="ic-praydot" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.4" stroke-dasharray="0.4 2.6" stroke-linecap="round" opacity="0.6"/>
  <circle cx="12" cy="4.5" r="2.5" fill="currentColor"/>
</svg>

<!-- WORD-ON-PAGE (scripture mark) -->
<svg id="ic-word" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 4h11l3 3v13H5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M16 4v3h3" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M8 11h8M8 14h8M8 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg>

<!-- PLUS (compose) -->
<svg id="ic-plus" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>

<!-- ARROW-LEFT -->
<svg id="ic-back" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<!-- CLOSE -->
<svg id="ic-close" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>

<!-- SLIDERS (filter / settings) -->
<svg id="ic-sliders" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

  <circle cx="16" cy="6" r="2" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="8" cy="12" r="2" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="1.6"/>
</svg>

<!-- CHECKMARK (constraint passed) -->
<svg id="ic-check" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

</svg>

<!-- HOME -->

<svg id="ic-chat" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

<!-- USER -->
<svg id="ic-user" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

  <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
