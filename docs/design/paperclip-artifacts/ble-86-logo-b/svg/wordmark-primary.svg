<?xml version="1.0" encoding="UTF-8"?>
<!--
  BlessCupid · Primary Wordmark · Direction B (Wordmark + halo)
  - Set in Source Serif 4, weight 500 (Medium).
  - Cobalt-900 (#142447) wordmark.
  - Gold-500 (#C99A3A) halo dot replacing tittle of `i` (uses dotless ı + overlay disc).
  - Gold-300 (#E9C780) sanctified-ground rule beneath wordmark.
  - viewBox 0 0 1200 360.
  - Engineer: rasterize via Puppeteer/Playwright with Source Serif 4 woff2 loaded.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="BlessCupid">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500&amp;display=swap');
      .bc-word {
        font-family: 'Source Serif 4', ui-serif, Georgia, serif;
        font-weight: 500;
        font-size: 200px;
        font-variation-settings: 'opsz' 60;
        letter-spacing: 1px;
        fill: #142447;
      }
    </style>
  </defs>
  <!-- Wordmark uses dotless i (U+0131) so we can overlay our own gold halo. -->
  <text x="600" y="220" text-anchor="middle" class="bc-word">BlessCup&#x0131;d</text>
  <!-- Gold halo dot, sized ~0.07 cap-height, vertically lifted ~0.28 cap-height above where tittle would sit. -->
  <circle cx="708" cy="62" r="14" fill="#C99A3A"/>
  <!-- Sanctified-ground rule: gold-300, 2px, length = ~36% viewBox width, centered. -->
  <line x1="385" y1="278" x2="815" y2="278" stroke="#E9C780" stroke-width="2"/>
</svg>
