<?xml version="1.0" encoding="UTF-8"?>
<!--
  BlessCupid · iOS App Icon (1024×1024) · cream ground · ALT
  For light-themed marketing surfaces, store screenshots, press kits.
  NOT recommended as default home-screen icon — cream blends with iOS default light wallpaper.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="BlessCupid app icon">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500&amp;display=swap');
      .bc-mono{font-family:'Source Serif 4',ui-serif,Georgia,serif;font-weight:500;font-size:720px;font-variation-settings:'opsz' 60;letter-spacing:-32px;fill:#142447;}
    </style>
  </defs>
  <rect width="1024" height="1024" fill="#FDFBF6"/>
  <text x="512" y="752" text-anchor="middle" class="bc-mono">BC</text>
  <circle cx="512" cy="200" r="64" fill="#C99A3A"/>
</svg>
