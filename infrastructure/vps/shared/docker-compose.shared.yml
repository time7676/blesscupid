# Shared services for all tenants on the XSERVER VPS
# Run once: docker compose -f docker-compose.shared.yml up -d
# Location on VPS: /srv/_shared/docker-compose.shared.yml

name: shared

networks:
  proxy:
    external: false
    name: proxy
  internal:
    external: false
    name: internal

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    # Graceful reloads via: docker exec caddy caddy reload --config /etc/caddy/Caddyfile

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - internal
      - proxy
    # Exposed to proxy so apps can reach it by name; each app uses its own DB role.
    # Recommended: run pg_dumpall cron from the host or a sidecar.
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Optional: shared Redis for sessions, rate-limiting, caching.
  # Uncomment when any tenant needs it.
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - internal
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  # redis_data:
